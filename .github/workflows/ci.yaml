name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mediastack
          POSTGRES_PASSWORD: mediastack
          POSTGRES_DB: mediastack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediastack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mediastack:mediastack@127.0.0.1:5432/mediastack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Tiers 1-3; the live tier is deselected by pytest.ini addopts
      - run: pytest -v
